{% extends "base.html" %}
{% block content %}

<h3>{{ t('favorites_title') }}</h3>

{% if fav_districts %}
<div class="row g-3">
  {% for d in fav_districts %}
  <div class="col-md-4">
    <div class="card h-100 shadow-sm">
      <div class="card-body">
        <h5>{{ field(d, 'name') }}</h5>
        <p class="text-muted small">{{ field(d, 'division') }}</p>
        <a href="{{ url_for('district_detail', district_id=d.id) }}" class="btn btn-sm btn-outline-success">
          {{ t('view_details') }}
        </a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="alert alert-info">{{ t('no_favorites') }}</div>
{% endif %}

{% endblock %}
